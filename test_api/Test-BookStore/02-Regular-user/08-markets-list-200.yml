info:
  name: "List markets"
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/api/markets"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200 && Array.isArray(res.getBody()) && res.getBody().length) {
          bru.setVar("markets_id", String(res.getBody()[0].id));
        }
    - type: tests
      code: |-
        test("Returns a list of records", () => {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body).to.be.an("array").and.not.be.empty;
          body.forEach((record) => expect(Object.keys(record).sort()).to.deep.equal(["id","name"]));
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: false
