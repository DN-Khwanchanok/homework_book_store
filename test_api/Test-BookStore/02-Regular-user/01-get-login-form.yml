info:
  name: "Get sign-in form"
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/session/new"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const token = res.getBody().match(/<meta name="csrf-token" content="([^"]+)"/);
          if (!token) throw new Error("CSRF token was not found in the sign-in form");
          bru.setVar("csrf_token", token[1]);
        }
    - type: tests
      code: |-
        test("The sign-in form is available", () => {
          expect(res.getStatus()).to.equal(200);
          expect(bru.getVar("csrf_token")).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: false
