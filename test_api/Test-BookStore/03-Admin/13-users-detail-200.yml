info:
  name: "Get user details"
  type: http
  seq: 13

http:
  method: GET
  url: "{{base_url}}/api/users/{{users_id}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns the selected record", () => {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(String(body.id)).to.equal(bru.getVar("users_id"));
          expect(Object.keys(body).sort()).to.deep.equal(["email_address","id"]);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: false
